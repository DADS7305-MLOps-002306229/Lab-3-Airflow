name: Asteroid Monitor CI and Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer commit replaces outdated checks on the same branch or pull request.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Python lint and formatting
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v5.0.0
      - name: Set up Python
        uses: actions/setup-python@v6.0.0
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install Ruff
        run: python -m pip install ruff==0.14.3
      - name: Check lint rules
        run: ruff check .
      - name: Check formatting
        run: ruff format --check .

  tests:
    name: Tests and DAG parsing (Python 3.11)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      AIRFLOW_HOME: /tmp/asteroid-airflow-tests
      AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
      PYTHONUNBUFFERED: '1'
    steps:
      - name: Check out repository
        uses: actions/checkout@v5.0.0
      - name: Set up Python and dependency cache
        uses: actions/setup-python@v6.0.0
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            pyproject.toml
      - name: Install Airflow with official release constraints
        run: >-
          python -m pip install apache-airflow==3.1.8
          --constraint https://raw.githubusercontent.com/apache/airflow/constraints-3.1.8/constraints-3.11.txt
      - name: Install project and test dependencies
        run: python -m pip install -r requirements-dev.txt -e .
      - name: Check dependency compatibility
        run: python -m pip check
      - name: Run offline tests, DAG parsing and dashboard checks
        run: python -m pytest -q --junitxml=test-results/pytest.xml
      - name: Save test report
        if: ${{ always() }}
        uses: actions/upload-artifact@v4.6.2
        with:
          name: pytest-results-python-3.11
          path: test-results/pytest.xml
          if-no-files-found: ignore
          retention-days: 7

  docker:
    name: Compose validation and Docker build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v5.0.0
      - name: Validate Docker Compose configuration
        run: docker compose config --quiet
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3.11.1
      # Both Compose services share this Dockerfile and image, so build once.
      - name: Build shared application image
        uses: docker/build-push-action@v6.18.0
        with:
          context: .
          file: Dockerfile
          tags: asteroid-monitor-airflow:ci
          load: true
          push: false
          cache-from: type=gha,scope=asteroid-monitor
          cache-to: type=gha,mode=max,scope=asteroid-monitor
      - name: Verify installed dependencies and dashboard configuration
        run: |
          docker run --rm --entrypoint bash asteroid-monitor-airflow:ci -euc '
            python -m pip check
            python -c "import airflow.sdk, asteroid_monitor, streamlit, plotly"
            test -f /opt/project/.streamlit/config.toml
          '

  package:
    name: Build Python package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v5.0.0
      - name: Set up Python
        uses: actions/setup-python@v6.0.0
        with:
          python-version: '3.11'
      - name: Install packaging tools
        run: python -m pip install build==1.3.0 twine==6.2.0
      - name: Check release tag matches package version
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PYTHON'
          import os
          import tomllib
          from pathlib import Path

          version = tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"]
          expected = f"v{version}"
          if os.environ["RELEASE_TAG"] != expected:
              raise SystemExit(f"Release tag must match pyproject.toml version: {expected}")
          PYTHON
      - name: Build wheel and source distribution
        run: python -m build
      - name: Validate distribution metadata
        run: python -m twine check --strict dist/*
      - name: Verify wheel installs and imports independently
        run: |
          python -m venv /tmp/package-smoke
          /tmp/package-smoke/bin/python -m pip install --no-deps dist/*.whl
          cd /tmp
          /tmp/package-smoke/bin/python -c 'import asteroid_monitor'
      - name: Save Python distributions
        uses: actions/upload-artifact@v4.6.2
        with:
          name: python-package
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  summary:
    name: CI result
    if: ${{ always() }}
    needs: [lint, tests, docker, package]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      LINT_RESULT: ${{ needs.lint.result }}
      TEST_RESULT: ${{ needs.tests.result }}
      DOCKER_RESULT: ${{ needs.docker.result }}
      PACKAGE_RESULT: ${{ needs.package.result }}
    steps:
      - name: Write results and enforce all checks
        run: |
          {
            echo '## Asteroid Monitor CI'
            echo '| Check | Result |'
            echo '| --- | --- |'
            echo "| Lint and formatting | $LINT_RESULT |"
            echo "| Tests and DAG parsing | $TEST_RESULT |"
            echo "| Compose and Docker image | $DOCKER_RESULT |"
            echo "| Python distributions | $PACKAGE_RESULT |"
          } >> "$GITHUB_STEP_SUMMARY"
          if [[ "$LINT_RESULT" != success || "$TEST_RESULT" != success || "$DOCKER_RESULT" != success || "$PACKAGE_RESULT" != success ]]; then
            echo '::error::One or more required CI jobs did not succeed.'
            exit 1
          fi

  release:
    name: Publish GitHub release
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
    needs: [summary]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Download validated Python distributions
        uses: actions/download-artifact@v4.3.0
        with:
          name: python-package
          path: dist
      - name: Create release with package assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" dist/* \
            --verify-tag \
            --title "Asteroid Monitor $RELEASE_TAG" \
            --generate-notes
