name: Python CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      AIRFLOW_HOME: /tmp/asteroid-airflow-tests
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-python@v5.6.0
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install apache-airflow==3.1.8 --constraint https://raw.githubusercontent.com/apache/airflow/constraints-3.1.8/constraints-3.11.txt
      - run: pip install -r requirements-dev.txt -e .
      - run: pip check
      - run: ruff check .
      - run: pytest -q
